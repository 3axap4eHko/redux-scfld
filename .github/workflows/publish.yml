name: Publish package
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check package contents without publishing
        type: boolean
        default: true
      package:
        description: npm package to publish
        type: choice
        required: true
        options:
          - redux-base
          - redux-scfld
permissions:
  contents: read
concurrency:
  group: npm-publish-${{ github.repository }}-${{ inputs.package }}
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install existing package manager
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Bootstrap workspace
        run: npm run bootstrap
      - name: Build package
        run: npm run build
      - name: Test package
        run: npm test
      - name: Prepare npm publishing
        run: npm install --global npm@11.19.1
      - name: Verify redux-base
        if: ${{ inputs.package == 'redux-base' }}
        working-directory: packages/redux-base
        env:
          EXPECTED_PACKAGE: redux-base
        run: test "$(npm pkg get name | jq -r .)" = "$EXPECTED_PACKAGE"
      - name: Check redux-base
        if: ${{ inputs.package == 'redux-base' && inputs.dry_run }}
        working-directory: packages/redux-base
        run: npm publish --dry-run --access public
      - name: Publish redux-base
        if: ${{ inputs.package == 'redux-base' && !inputs.dry_run }}
        working-directory: packages/redux-base
        run: npm publish --access public
      - name: Verify redux-scfld
        if: ${{ inputs.package == 'redux-scfld' }}
        working-directory: packages/redux-scfld
        env:
          EXPECTED_PACKAGE: redux-scfld
        run: test "$(npm pkg get name | jq -r .)" = "$EXPECTED_PACKAGE"
      - name: Check redux-scfld
        if: ${{ inputs.package == 'redux-scfld' && inputs.dry_run }}
        working-directory: packages/redux-scfld
        run: npm publish --dry-run --access public
      - name: Publish redux-scfld
        if: ${{ inputs.package == 'redux-scfld' && !inputs.dry_run }}
        working-directory: packages/redux-scfld
        run: npm publish --access public
